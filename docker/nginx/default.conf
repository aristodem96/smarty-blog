server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Serve existing static files directly, route everything else to the front controller.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Only the front controller is executable.
    location = /index.php {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Any other .php file under public/ is never executed.
    location ~ \.php$ {
        return 404;
    }

    # Hidden files (.git, .env, ...).
    location ~ /\. {
        deny all;
    }
}
