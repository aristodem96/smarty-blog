server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Do not reveal the Nginx version in the Server header and error pages.
    server_tokens off;

    # Security headers for every response, including 404/500 ("always").
    # Note: add_header is inherited only by locations that declare no add_header of their own.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Serve existing static files directly, route everything else to the front controller.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Static files: CSS URLs carry ?v=<mtime>, article images never change — safe to cache long.
    location ^~ /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    location ^~ /images/ {
        expires 30d;
        try_files $uri =404;
    }

    # Only the front controller is executable.
    location = /index.php {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Any other .php file under public/ is never executed.
    location ~ \.php$ {
        return 404;
    }

    # Hidden files (.git, .env, ...).
    location ~ /\. {
        deny all;
    }
}
