services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-0}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-blog}
      DB_USER: ${DB_USER:-blog}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # PHP-FPM listens only after the entrypoint (composer install, migrations, seeding) has finished.
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 120s

  nginx:
    image: nginx:1.30-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      # Nginx sees only public/ — source code and config are not reachable from the web.
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    # Nginx starts last, so `docker compose up -d` returns only when the site can serve requests.
    depends_on:
      php:
        condition: service_healthy
      assets:
        condition: service_completed_successfully

  # One-off job: compiles scss/ into public/assets/css/app.css and exits.
  # Watch mode while developing: docker compose run --rm assets npm run watch
  assets:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm ci --no-audit --no-fund && npm run build"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-blog}
      MYSQL_USER: ${DB_USER:-blog}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      # Exposed for a DB client on the host (e.g. PhpStorm Database tool).
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # TCP (127.0.0.1), not the socket: during init MySQL runs a temporary
      # server without networking, so the check passes only on the real one.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql-data:
